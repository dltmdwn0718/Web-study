<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>공지사항 & 투두리스트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1 id="current-date"></h1>
    
    <!-- 동적 타임테이블 영역 -->
    <div class="input-group">
      <input type="time" id="time-input">
      <input type="text" id="schedule-input" placeholder="스케줄 입력">
      <button id="add-schedule-btn">추가</button>
    </div>
    <ul id="schedule-list" class="timetable-list"></ul>

    <hr class="divider">

    <!-- 투두리스트 & 공지 영역 -->
    <div class="input-group">
      <input type="text" id="task-input" placeholder="할 일이나 공지 링크 입력">
      <button id="add-btn">추가</button>
    </div>
    <ul id="task-list"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
