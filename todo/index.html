<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>공지사항 & 투두리스트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>나만의 투두 & 공지 확인</h1>
    <div class="input-group">
      <!-- 나중에는 여기에 공지사항 링크를 넣게 됩니다 -->
      <input type="text" id="task-input" placeholder="할 일이나 공지 링크 입력">
      <button id="add-btn">추가</button>
    </div>
    <ul id="task-list">
      <!-- 자바스크립트가 여기에 리스트(li)를 하나씩 넣어줄 겁니다 -->
    </ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
